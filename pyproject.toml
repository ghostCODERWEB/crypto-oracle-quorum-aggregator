[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-oracle-quorum-aggregator"
version = "0.1.0"
description = "Filter stale feeds, enforce distinct reporters and evaluate median deviation under quorum requirements."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-oracle-quorum-aggregator = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
